[package]
name = "jammy-server"
version = "0.1.0"
edition = "2021"

[dependencies]
rocket = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
